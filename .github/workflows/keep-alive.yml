# Render'in ucretsiz sunucusu 15 dk istek almazsa uyur ve ilk istek 30-50 sn surer.
# Bu gorev sunucuyu 10 dakikada bir uyandirir (GitHub Actions, herkese acik depolarda ucretsiz).
name: Sunucuyu uyanik tut

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: MUTA API ping
        run: curl -fsS -m 90 --retry 3 --retry-delay 10 -o /dev/null -w "%{http_code} %{time_total}s\n" https://muta-api-zthp.onrender.com/
